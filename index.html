<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم التحميل</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.6);
            z-index: -1;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            position: relative;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* تنسيق الأيقونات الاحترافية للشاحنات */
        .truck-indicators {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .truck-svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            opacity: 0.85;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .truck-svg:hover {
            transform: translateY(-2px);
            opacity: 1;
        }

        /* حاشية ذيل الصفحة للمؤسسة */
        .corporate-footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.45);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
            width: 100%;
            max-width: 480px;
        }

        /* تنسيق نظام الإشعارات (Toast) المخصص */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background: rgba(220, 38, 38, 0.95);
            backdrop-filter: blur(8px);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes toastEnter {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastExit {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }

        /* تنسيق الشرائح */
        .slide {
            display: none;
            animation: slideIn 0.4s ease-out forwards;
        }

        .slide.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        /* الأوجه */
        .rating-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .rate-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rate-option:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .rate-option.active {
            background: rgba(255, 255, 255, 0.25);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
            transform: scale(1.05);
        }

        .emoji {
            font-size: 2.5rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .rate-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .rate-option.active .rate-text {
            color: #ffffff;
            font-weight: 700;
        }

        /* الحقول */
        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
        }

        select.form-control option {
            background-color: #1e293b;
            color: #fff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* الأزرار المشتركة */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .btn-next, .btn-submit, .btn-action {
            background: linear-gradient(135deg, #007bff, #00d2ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-next:hover, .btn-submit:hover, .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
        }

        .btn-prev {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-prev:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* أزرار القرار (نعم/لا) */
        .decision-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-yes { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-yes:hover { background: #dc2626; box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); }
        
        .btn-no { background: #10b981; color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-no:hover { background: #059669; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }

        /* رسالة النجاح */
        #successMsg {
            display: none;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 20px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.2rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            animation: slideIn 0.4s ease-out forwards;
        }

        /* مؤشر التقدم (Progress Dots) */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .dot.active {
            background: #60a5fa;
            box-shadow: 0 0 8px #60a5fa;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div id="toastContainer" class="toast-container"></div>

    <div class="container">
        
        <div class="progress-dots" id="progressDots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="slide active" id="slide-1">
            <h2>كيف كانت تجربة التحميل اليوم؟</h2>
            
            <div class="truck-indicators">
                <svg class="truck-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
                <svg class="truck-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
                <svg class="truck-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
            </div>

            <div class="rating-grid">
                <div class="rate-option" data-value="ممتاز"><span class="emoji">🤩</span><span class="rate-text">ممتاز</span></div>
                <div class="rate-option" data-value="جيد جداً"><span class="emoji">😄</span><span class="rate-text">جيد جداً</span></div>
                <div class="rate-option" data-value="جيد"><span class="emoji">🙂</span><span class="rate-text">جيد</span></div>
                <div class="rate-option" data-value="مقبول"><span class="emoji">😐</span><span class="rate-text">مقبول</span></div>
                <div class="rate-option" data-value="سيئ"><span class="emoji">🙁</span><span class="rate-text">سيئ</span></div>
                <div class="rate-option" data-value="سيئ جداً"><span class="emoji">😡</span><span class="rate-text">سيئ جداً</span></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-next" onclick="nextSlide(1)">التالي</button>
            </div>
        </div>

        <div class="slide" id="slide-2">
            <h2>بيانات السائق</h2>
            <div class="form-group">
                <label for="driverName">اسم السائق</label>
                <input type="text" id="driverName" class="form-control" placeholder="اكتب اسمك هنا...">
            </div>
            <div class="form-group">
                <label for="driverPhone">رقم الموبايل</label>
                <input type="tel" id="driverPhone" class="form-control" placeholder="أدخل رقم الموبايل للتواصل...">
            </div>
            <div class="btn-group">
                <button class="btn btn-prev" onclick="prevSlide(2)">السابق</button>
                <button class="btn btn-next" onclick="nextSlide(2)">التالي</button>
            </div>
        </div>

        <div class="slide" id="slide-3">
            <h2>بيانات المنتج</h2>
            <div class="form-group">
                <label for="productName">اسم المنتج المحمل</label>
                <input type="text" id="productName" class="form-control" placeholder="اكتب اسم أو نوع المنتج...">
            </div>
            <div class="btn-group">
                <button class="btn btn-prev" onclick="prevSlide(3)">السابق</button>
                <button class="btn btn-next" onclick="nextSlide(3)">التالي</button>
            </div>
        </div>

        <div class="slide" id="slide-4">
            <h2>هل واجهتك أي مشكلة أثناء التحميل؟</h2>
            <div class="decision-group">
                <button class="btn btn-no" onclick="submitData(false)">لا، كل شيء كان ممتازاً</button>
                <button class="btn btn-yes" onclick="nextSlide(4)">نعم، واجهت مشكلة</button>
            </div>
            <div class="btn-group" style="margin-top: 20px;">
                <button class="btn btn-prev" onclick="prevSlide(4)">الرجوع لبيانات المنتج</button>
            </div>
        </div>

        <div class="slide" id="slide-5">
            <h2>تفاصيل المشكلة</h2>
            <div class="form-group">
                <label for="loadingTime">كم استغرق وقت التحميل؟</label>
                <select id="loadingTime" class="form-control">
                    <option value="غير محدد">اختر الوقت...</option>
                    <option value="أقل من ساعة">أقل من ساعة</option>
                    <option value="من ساعة إلى ساعتين">من ساعة إلى ساعتين</option>
                    <option value="أكثر من ساعتين">أكثر من ساعتين</option>
                    <option value="تأخير طويل جداً">تأخير طويل جداً</option>
                </select>
            </div>
            <div class="form-group">
                <label for="problemDetails">تفاصيل المشكلة</label>
                <textarea id="problemDetails" class="form-control" placeholder="اشرح لنا المشكلة التي واجهتك باختصار..."></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-prev" onclick="prevSlide(5)">السابق</button>
                <button class="btn btn-submit" id="submitBtn" onclick="submitData(true)">إرسال التقييم</button>
            </div>
        </div>

        <div id="successMsg">تم إرسال تقييمك بنجاح! شكراً لتعاونك</div>

    </div>

    <div class="corporate-footer">إدارة نظم المعلومات - الشركة العربية لصناعة الكرتون والمنتجات الورقية</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACDQlFpC8YszzqVWhT4l9BUeVTAZNyUp8",
            authDomain: "rate-b53e9.firebaseapp.com",
            projectId: "rate-b53e9",
            storageBucket: "rate-b53e9.firebasestorage.app",
            messagingSenderId: "790364557261",
            appId: "1:790364557261:web:4ed06faaa81ea49361be84"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedRating = null;
        
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastExit 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 3000);
        }

        const rateOptions = document.querySelectorAll('.rate-option');
        rateOptions.forEach(option => {
            option.addEventListener('click', function() {
                rateOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                selectedRating = this.getAttribute('data-value');
            });
        });

        window.nextSlide = function(currentSlideNum) {
            if(currentSlideNum === 1 && !selectedRating) {
                showToast("برجاء اختيار تقييم أولاً للاستمرار");
                return;
            }
            if(currentSlideNum === 2) {
                const name = document.getElementById('driverName').value.trim();
                const phone = document.getElementById('driverPhone').value.trim();
                if(!name || !phone) {
                    showToast("برجاء إدخال اسم السائق ورقم الموبايل");
                    return;
                }
            }
            if(currentSlideNum === 3) {
                const product = document.getElementById('productName').value.trim();
                if(!product) {
                    showToast("برجاء إدخال اسم المنتج");
                    return;
                }
            }

            document.getElementById(`slide-${currentSlideNum}`).classList.remove('active');
            document.getElementById(`slide-${currentSlideNum + 1}`).classList.add('active');
            updateProgress(currentSlideNum + 1);
        }

        window.prevSlide = function(currentSlideNum) {
            document.getElementById(`slide-${currentSlideNum}`).classList.remove('active');
            document.getElementById(`slide-${currentSlideNum - 1}`).classList.add('active');
            updateProgress(currentSlideNum - 1);
        }

        function updateProgress(step) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if(index < step) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
                document.getElementById('progressDots').style.display = (step === 5) ? 'none' : 'flex';
            });
        }

        window.submitData = async function(hasProblem) {
            const btnSubmit = document.getElementById('submitBtn');
            const noProblemBtn = document.querySelector('.btn-no');
            
            if(hasProblem) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = 'جاري الإرسال...';
            } else {
                noProblemBtn.disabled = true;
                noProblemBtn.innerHTML = 'جاري الإرسال...';
            }

            const evaluationData = {
                rating: selectedRating,
                driverName: document.getElementById('driverName').value.trim(),
                driverPhone: document.getElementById('driverPhone').value.trim(),
                productName: document.getElementById('productName').value.trim(),
                hasProblem: hasProblem,
                loadingTime: hasProblem ? document.getElementById('loadingTime').value : 'لا يوجد',
                problemDetails: hasProblem ? document.getElementById('problemDetails').value : 'لا يوجد',
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "loading_evaluations"), evaluationData);
                
                document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
                document.getElementById('progressDots').style.display = 'none';
                
                document.getElementById('successMsg').style.display = 'block';
                
                setTimeout(() => {
                    window.location.reload();
                }, 3000);

            } catch (error) {
                console.error("Error adding document: ", error);
                showToast("حدث خطأ أثناء إرسال التقييم، برجاء المحاولة مرة أخرى.");
                if(hasProblem) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'إرسال التقييم';
                } else {
                    noProblemBtn.disabled = false;
                    noProblemBtn.innerHTML = 'لا، كل شيء كان ممتازاً';
                }
            }
        }
    </script>
</body>
</html>
