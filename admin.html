<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم التقييمات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --primary: #60a5fa;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --modal-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 30, 0.75);
            z-index: -1;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر */
        .header-glass {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h2 { font-size: 1.8rem; font-weight: 800; }

        /* شبكة الكروت (Cards Grid) */
        .cards-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .eval-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .eval-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .driver-name {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .emoji-large {
            font-size: 2rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .date-badge {
            direction: ltr;
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #f1f5f9;
            text-align: right;
            align-self: flex-start;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* زر عرض المزيد */
        .btn-load-more {
            background: rgba(96, 165, 250, 0.2);
            color: var(--primary);
            border: 1px solid rgba(96, 165, 250, 0.4);
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-load-more:hover {
            background: rgba(96, 165, 250, 0.4);
            color: #fff;
        }

        /* النوافذ المنبثقة (Modals) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 35px 25px 25px 25px;
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 1.5rem;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .close-btn:hover { background: var(--danger); }

        .modal-header-info {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        .modal-emoji { font-size: 3.5rem; margin-bottom: 10px; display: block; }
        .modal-title { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        
        .modal-date {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 1.1rem;
            direction: ltr;
            display: block;
        }

        .modal-body { display: flex; flex-direction: column; gap: 12px; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-label { color: var(--text-muted); font-weight: 700; font-size: 0.95rem; }
        .info-value { font-weight: 800; font-size: 1.05rem; text-align: left; }
        .info-col { flex-direction: column; align-items: flex-start; gap: 8px; }
        .info-col .info-value { text-align: right; font-weight: 600; line-height: 1.5; color: #e2e8f0; }

        .badge { padding: 4px 12px; border-radius: 50px; font-size: 0.9rem; font-weight: 700; }
        .badge-danger { background: rgba(248, 113, 113, 0.2); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.4); }
        .badge-success { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.4); }

        /* أزرار الحذف داخل المودال */
        .btn-delete-main {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }
        .btn-delete-main:hover { background: var(--danger); color: white; }

        /* مودال تأكيد الحذف */
        .confirm-modal-content {
            text-align: center;
            padding: 40px 25px 25px 25px;
            max-width: 380px;
        }
        .confirm-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
        }
        .confirm-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 25px;
        }
        .confirm-actions {
            display: flex;
            gap: 15px;
        }
        .btn-cancel {
            flex: 1;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-confirm-delete {
            flex: 1;
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-confirm-delete:hover { background: var(--danger-hover); }

        #loader { text-align: center; padding: 30px; font-weight: 800; font-size: 1.2rem; color: var(--primary); }

        /* لضمان تنسيق رقم الموبايل */
        .ltr-text { direction: ltr; display: inline-block; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-glass">
            <h2>لوحة تحكم التقييمات 📊</h2>
        </div>

        <div id="loader">جاري جلب البيانات... ⏳</div>
        
        <div class="cards-grid" id="cardsContainer"></div>

        <button id="loadMoreBtn" class="btn-load-more">عرض المزيد ⬇️</button>
    </div>

    <div class="modal-overlay" id="popupModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            
            <div class="modal-header-info">
                <span class="modal-emoji" id="m-emoji">🤩</span>
                <div class="modal-title" id="m-driverName">اسم السائق</div>
                <div class="modal-date" id="m-date">التاريخ</div>
            </div>

            <div class="modal-body">
                <div class="info-row">
                    <span class="info-label">رقم الموبايل:</span>
                    <span class="info-value ltr-text" id="m-phone">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">اسم المنتج:</span>
                    <span class="info-value" id="m-product">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">التقييم:</span>
                    <span class="info-value" id="m-rating">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">وقت التحميل:</span>
                    <span class="info-value" id="m-time">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">حالة المشكلة:</span>
                    <span class="info-value" id="m-problemBadge">-</span>
                </div>
                <div class="info-row info-col" id="m-detailsRow">
                    <span class="info-label">تفاصيل المشكلة:</span>
                    <span class="info-value" id="m-details">-</span>
                </div>
            </div>

            <button id="openDeleteConfirmBtn" class="btn-delete-main">🗑️ حذف هذا التقييم</button>
        </div>
    </div>

    <div class="modal-overlay" id="deleteConfirmModal">
        <div class="modal-content confirm-modal-content">
            <span class="confirm-icon">⚠️</span>
            <div class="confirm-text">هل أنت متأكد من حذف هذا التقييم؟ لا يمكن التراجع عن هذا الإجراء.</div>
            <div class="confirm-actions">
                <button id="cancelDeleteBtn" class="btn-cancel">إلغاء</button>
                <button id="executeDeleteBtn" class="btn-confirm-delete">نعم، احذف</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit, startAfter, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACDQlFpC8YszzqVWhT4l9BUeVTAZNyUp8",
            authDomain: "rate-b53e9.firebaseapp.com",
            projectId: "rate-b53e9",
            storageBucket: "rate-b53e9.firebasestorage.app",
            messagingSenderId: "790364557261",
            appId: "1:790364557261:web:4ed06faaa81ea49361be84"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const cardsContainer = document.getElementById('cardsContainer');
        const loader = document.getElementById('loader');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        
        // Modals
        const detailsModal = document.getElementById('popupModal');
        const confirmModal = document.getElementById('deleteConfirmModal');

        const ratingEmojis = {
            "ممتاز": "🤩", "جيد جداً": "😄", "جيد": "🙂",
            "مقبول": "😐", "سيئ": "🙁", "سيئ جداً": "😡"
        };

        let lastVisibleDoc = null; 
        let currentDocIdToDelete = null; 
        let currentCardElementToRemove = null; 

        const limitCount = 30; 

        async function fetchEvaluations(isLoadMore = false) {
            try {
                if (!isLoadMore) {
                    cardsContainer.innerHTML = ''; 
                    loader.style.display = 'block';
                } else {
                    loadMoreBtn.innerText = 'جاري التحميل...';
                    loadMoreBtn.disabled = true;
                }

                let q;
                if (isLoadMore && lastVisibleDoc) {
                    q = query(collection(db, "loading_evaluations"), orderBy("timestamp", "desc"), startAfter(lastVisibleDoc), limit(limitCount));
                } else {
                    q = query(collection(db, "loading_evaluations"), orderBy("timestamp", "desc"), limit(limitCount));
                }

                const querySnapshot = await getDocs(q);
                
                if (!isLoadMore) loader.style.display = 'none';

                if (querySnapshot.empty && !isLoadMore) {
                    cardsContainer.innerHTML = `<div style="text-align:center; padding:30px; grid-column: 1 / -1; width: 100%;">لا توجد تقييمات مسجلة حتى الآن.</div>`;
                    loadMoreBtn.style.display = 'none';
                    return;
                }

                lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1];

                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const docId = docSnapshot.id;
                    
                    let formattedDateTime = "غير محدد";
                    if (data.timestamp) {
                        const dateObj = data.timestamp.toDate();
                        const datePart = dateObj.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
                        const timePart = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
                        formattedDateTime = `${datePart} - ${timePart}`;
                    } else {
                        const now = new Date();
                        formattedDateTime = `${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG')}`;
                    }
                    
                    data.formattedDateTime = formattedDateTime;
                    data.id = docId;

                    const emoji = ratingEmojis[data.rating] || "📝";
                    const driverName = data.driverName || 'غير محدد';

                    const card = document.createElement('div');
                    card.className = 'eval-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <span class="driver-name">👤 ${driverName}</span>
                                <span class="date-badge">${formattedDateTime}</span>
                            </div>
                            <span class="emoji-large">${emoji}</span>
                        </div>
                    `;

                    card.addEventListener('click', () => openDetailsModal(data, card));
                    
                    cardsContainer.appendChild(card);
                });

                if (querySnapshot.size < limitCount) {
                    loadMoreBtn.style.display = 'none'; 
                } else {
                    loadMoreBtn.style.display = 'block';
                    loadMoreBtn.innerText = 'عرض المزيد ⬇️';
                    loadMoreBtn.disabled = false;
                }

            } catch (error) {
                console.error("Error fetching data:", error);
                if (!isLoadMore) loader.innerHTML = `<span style="color: #fca5a5;">حدث خطأ أثناء جلب البيانات.</span>`;
            }
        }

        function openDetailsModal(data, cardElement) {
            currentDocIdToDelete = data.id; 
            currentCardElementToRemove = cardElement; 

            document.getElementById('m-emoji').innerText = ratingEmojis[data.rating] || "📝";
            document.getElementById('m-driverName').innerText = data.driverName || 'غير محدد';
            document.getElementById('m-date').innerText = data.formattedDateTime;
            
            // إضافة رقم الموبايل
            document.getElementById('m-phone').innerText = data.driverPhone || 'غير مسجل';
            
            // إضافة اسم المنتج مع دعم البيانات القديمة لاسم الشركة
            document.getElementById('m-product').innerText = data.productName || data.companyName || 'غير محدد';
            
            document.getElementById('m-rating').innerText = data.rating;
            document.getElementById('m-time').innerText = (data.loadingTime && data.loadingTime !== 'غير محدد') ? data.loadingTime : '-';
            
            const badgeHtml = data.hasProblem 
                ? `<span class="badge badge-danger">يوجد مشكلة</span>` 
                : `<span class="badge badge-success">لا يوجد</span>`;
            document.getElementById('m-problemBadge').innerHTML = badgeHtml;

            const detailsRow = document.getElementById('m-detailsRow');
            if (data.problemDetails && data.problemDetails.trim() !== "") {
                document.getElementById('m-details').innerText = data.problemDetails;
                detailsRow.style.display = 'flex';
            } else {
                detailsRow.style.display = 'none';
            }

            detailsModal.classList.add('active');
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            detailsModal.classList.remove('active');
        });

        document.getElementById('openDeleteConfirmBtn').addEventListener('click', () => {
            detailsModal.classList.remove('active'); 
            confirmModal.classList.add('active'); 
        });

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            confirmModal.classList.remove('active');
            detailsModal.classList.add('active'); 
        });

        document.getElementById('executeDeleteBtn').addEventListener('click', async () => {
            if (!currentDocIdToDelete) return;
            
            const btn = document.getElementById('executeDeleteBtn');
            btn.innerText = 'جاري الحذف...';
            btn.disabled = true;

            try {
                await deleteDoc(doc(db, "loading_evaluations", currentDocIdToDelete));
                
                if (currentCardElementToRemove) {
                    currentCardElementToRemove.remove();
                }

                confirmModal.classList.remove('active');
                
            } catch (error) {
                console.error("Error deleting document: ", error);
                alert("حدث خطأ أثناء الحذف.");
            } finally {
                btn.innerText = 'نعم، احذف';
                btn.disabled = false;
            }
        });

        loadMoreBtn.addEventListener('click', () => {
            fetchEvaluations(true);
        });

        window.addEventListener('click', (e) => {
            if (e.target === detailsModal) detailsModal.classList.remove('active');
            if (e.target === confirmModal) confirmModal.classList.remove('active');
        });

        fetchEvaluations(false);
    </script>
</body>
</html>
